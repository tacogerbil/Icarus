pluginManagement {
    repositories {
        maven {
            name = 'ParchmentMC'
            url = 'https://maven.parchmentmc.org'
        }
        gradlePluginPortal()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
    }
}

plugins {
    id 'eclipse'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.+'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

version = '1.0.0'
group = 'com.yourname.rocketeerjetpack' // Change this to your own group!
archivesBaseName = 'rocketeerjetpack'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    mappings channel: 'parchment', version: '2023.09.03-1.20.1'

    // This is the main declaration for Forge.
    // Make sure the version matches your MDK.
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', archivesBaseName
            mods {
                "${archivesBaseName}" {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', archivesBaseName
            mods {
                "${archivesBaseName}" {
                    source sourceSets.main
                }
            }
        }

        gameTestServer {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGIST...RIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', archivesBaseName
            mods {
                "${archivesBaseName}" {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            args ' --mod', archivesBaseName, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            mods {
                "${archivesBaseName}" {
                    source sourceSets.main
                }
            }
        }
    }
}

// This is where we tell Gradle where to find our dependency mods.
repositories {
    // Caelus API is hosted here
    maven { url "https://maven.theillusivec4.top/" }
    // Create is hosted on CurseForge, so we use CurseMaven
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'

    // Caelus API Dependency
    // We use 'compileOnly' because Caelus is an API; we only need it to write our code.
    // Players will need to download it separately.
    compileOnly fg.deobf("top.theillusivec4.caelus:caelus-forge:1.20.1-3.1.0.1")

    // Create Mod Dependency
    // We use 'implementation' because we want to use its items and code directly.
    // The 'fg.deobf' part tells ForgeGradle to de-obfuscate the mod code so we can use it.
    implementation fg.deobf("curse.maven:create-328085:4993474")
}


jar {
    manifest {
        attributes([
                "Specification-Title"     : "Rocketeer Jetpack",
                "Specification-Vendor"    : "YourName", // Change this
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "YourName", // Change this
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}
